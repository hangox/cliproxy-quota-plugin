name: Build and Release Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux amd64 Shared Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run Tests
        run: |
          go test -v -count=1 ./pkg/...

      - name: Build C-ABI Shared Library (.so)
        run: |
          mkdir -p dist
          # 在 Ubuntu 上启用 CGO 编译出标准的 Linux amd64 .so
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o dist/cliproxy-quota-plugin.so .
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliproxy-quota-plugin-linux-amd64
          path: dist/cliproxy-quota-plugin.so

      - name: Release Latest Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latest Release (${{ github.sha }})"
          prerelease: false
          files: |
            dist/cliproxy-quota-plugin.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux amd64 Shared Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run Tests
        run: |
          go test -v -count=1 ./pkg/...

      - name: Build C-ABI Shared Library (.so)
        run: |
          mkdir -p dist
          # 1. 编译 Linux amd64 动态库
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o dist/cliproxy-quota-plugin.so .

          # 2. 按照 CLIProxyAPI 官方插件市场标准规范打包：
          # 规范命名：{id}_{version}_{goos}_{goarch}.zip
          VERSION="0.1.0"
          cd dist
          zip -j "cliproxy-quota-plugin_${VERSION}_linux_amd64.zip" cliproxy-quota-plugin.so

          # 3. 生成标准的 checksums.txt 校验和文件
          sha256sum "cliproxy-quota-plugin_${VERSION}_linux_amd64.zip" > checksums.txt
          cat checksums.txt
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliproxy-quota-plugin-linux-amd64
          path: dist/

      - name: Release Latest Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1.0
          name: "Release v0.1.0"
          prerelease: false
          files: |
            dist/cliproxy-quota-plugin.so
            dist/cliproxy-quota-plugin_0.1.0_linux_amd64.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
